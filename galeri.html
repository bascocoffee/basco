<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Galeri — Basco</title>
  <meta name="description" content="Foto suasana dan sajian Basco, Bangkalan." />
  <link rel="icon" href="img/favicon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="head"></div>

  <main>
    <header class="wrap page-top">
      <h1>Galeri</h1>
      <p class="lead">Sedikit momen dari ruang dan cangkir kami. Klik foto untuk memperbesar.</p>
    </header>
    <section class="wrap">
      <div class="masonry" id="masonry"></div>
    </section>
    <dialog class="lb" id="lb" aria-label="Foto diperbesar">
      <button class="x" type="button" aria-label="Tutup">&times;</button>
      <img src="" alt="" />
      <p></p>
    </dialog>
  </main>

  <div id="foot"></div>
  <script src="js/data.js"></script>
  <script src="js/site.js"></script>
</body>
</html>
