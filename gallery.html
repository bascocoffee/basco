<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Galeri - B A S C O</title>
    <link rel="icon" href="img/logo basco 1.png" type="image/x-icon" />
    <meta
      name="description"
      content="Koleksi foto suasana dan produk BASCO - Bangkalan Specialty Coffee."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap"
      rel="stylesheet"
    />

    <style>
      /* --- VARIABEL TEMA --- */
      :root {
        --bg-primary: #fdfbf7;
        --bg-secondary: #f4ede2;
        --text-main: #2c2520;
        --text-muted: #6e645e;
        --accent: #8c6239;
        --white: #ffffff;
        --shadow: 0 10px 30px rgba(140, 98, 57, 0.06);
        --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        background-color: var(--bg-primary);
        color: var(--text-main);
        line-height: 1.6;
      }

      .container {
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 24px;
      }

      /* --- HEADER & NAV --- */
      header {
        background-color: rgba(253, 251, 247, 0.85);
        backdrop-filter: blur(12px);
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        z-index: 1000;
        border-bottom: 1px solid rgba(140, 98, 57, 0.08);
      }
      .nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        height: 80px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        text-decoration: none;
      }
      .brand-title {
        font-family: "Playfair Display", serif;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 2px;
        color: var(--accent);
      }
      .brand-sub {
        font-size: 11px;
        color: var(--text-muted);
        letter-spacing: 1px;
      }

      nav ul {
        display: flex;
        list-style: none;
        gap: 32px;
      }
      nav ul a {
        font-size: 15px;
        font-weight: 500;
        color: var(--text-main);
        text-decoration: none;
        position: relative;
        transition: var(--transition);
      }
      nav ul a:hover,
      nav ul a.active {
        color: var(--accent);
      }
      nav ul a.active::after {
        content: "";
        position: absolute;
        bottom: -6px;
        left: 0;
        width: 100%;
        height: 2px;
        background-color: var(--accent);
      }

      .menu-toggle {
        display: none;
        background: none;
        border: none;
        font-size: 28px;
        cursor: pointer;
        color: var(--text-main);
      }

      /* --- HERO GALERI --- */
      main {
        padding-top: 140px;
      }
      .hero-section {
        text-align: center;
        margin-bottom: 60px;
      }
      .hero-section h1 {
        font-family: "Playfair Display", serif;
        font-size: 48px;
        color: var(--text-main);
        margin-bottom: 16px;
      }
      .hero-section p {
        color: var(--text-muted);
        font-size: 18px;
        max-width: 600px;
        margin: 0 auto;
      }

      /* --- GRID GALERI --- */
      .gallery-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 20px;
        margin-bottom: 80px;
      }

      .gallery-item {
        overflow: hidden;
        border-radius: 20px;
        box-shadow: var(--shadow);
        background: var(--bg-secondary);
        aspect-ratio: 1 / 1;
        border: 1px solid rgba(140, 98, 57, 0.05);
      }

      .gallery-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: var(--transition);
        display: block;
      }

      .gallery-item:hover img {
        transform: scale(1.1);
        filter: brightness(0.9);
      }

      /* --- MOBILE NAVIGATION PANEL --- */
      .mobile-nav {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        z-index: 2000;
        display: none;
        justify-content: flex-end;
      }
      .mobile-nav .panel {
        background: var(--bg-primary);
        width: 280px;
        height: 100%;
        padding: 40px 24px;
        box-shadow: -10px 0 30px rgba(0, 0, 0, 0.1);
      }

      footer {
        padding: 60px 0;
        border-top: 1px solid var(--accent-light);
        text-align: center;
        color: var(--text-muted);
        font-size: 14px;
      }

      /* --- ANIMATION --- */
      .fade-up {
        opacity: 0;
        transform: translateY(20px);
        animation: fadeUp 0.6s forwards;
      }
      @keyframes fadeUp {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 768px) {
        nav {
          display: none;
        }
        .menu-toggle {
          display: block;
        }
        .hero-section h1 {
          font-size: 36px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="container nav">
        <a href="index.html" class="brand">
          <img src="img/logo basco 1.png" alt="Logo" style="width: 35px" />
          <div>
            <div class="brand-title">B A S C O</div>
            <div class="brand-sub">#startwithBasco</div>
          </div>
        </a>

        <nav>
          <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="menu.html">Menu</a></li>
            <li><a href="team.html">Team</a></li>
            <li><a href="gallery.html" class="active">Galeri</a></li>
            <li><a href="kontak.html">Kontak</a></li>
          </ul>
        </nav>

        <button class="menu-toggle" onclick="openMobile()">☰</button>
      </div>
    </header>

    <main class="container">
      <section class="hero-section fade-up">
        <br />
        <br />
        <br />
        <h1>Galeri Foto</h1>
        <p>Melihat lebih dekat setiap momen dan sajian spesial kami.</p>
      </section>

      <div class="gallery-grid">
        <div class="gallery-item fade-up">
          <img src="img/galeri1.png" alt="Momen Basco 1" />
        </div>
        <div class="gallery-item fade-up">
          <img src="img/galeri2.png" alt="Momen Basco 2" />
        </div>
        <div class="gallery-item fade-up">
          <img src="img/galeri3.png" alt="Momen Basco 3" />
        </div>
        <div class="gallery-item fade-up">
          <img src="img/galeri4.png" alt="Momen Basco 4" />
        </div>
        <div class="gallery-item fade-up">
          <img src="img/galeri5.png" alt="Momen Basco 5" />
        </div>
        <div class="gallery-item fade-up">
          <img src="img/galeri6.png" alt="Momen Basco 6" />
        </div>
        <div class="gallery-item fade-up">
          <img src="img/galeri7.png" alt="Momen Basco 7" />
        </div>
        <div class="gallery-item fade-up">
          <img src="img/galeri8.png" alt="Momen Basco 8" />
        </div>
      </div>
    </main>

    <footer>
      <p>&copy; <span id="year"></span> Basco Coffee. All rights reserved.</p>
    </footer>

    <div class="mobile-nav" id="mobileNav" onclick="closeMobile()">
      <div class="panel" onclick="event.stopPropagation()">
        <nav style="display: block">
          <ul
            style="
              list-style: none;
              padding: 0;
              margin: 0;
              display: flex;
              flex-direction: column;
              gap: 20px;
            "
          >
            <li><a href="index.html" onclick="closeMobile()">Home</a></li>
            <li><a href="menu.html" onclick="closeMobile()">Menu</a></li>
            <li><a href="team.html" onclick="closeMobile()">Team</a></li>
            <li><a href="gallery.html" onclick="closeMobile()">Galeri</a></li>
            <li><a href="kontak.html" onclick="closeMobile()">Kontak</a></li>
          </ul>
        </nav>
      </div>
    </div>

    <script>
      document.getElementById("year").textContent = new Date().getFullYear();

      function openMobile() {
        document.getElementById("mobileNav").style.display = "flex";
      }
      function closeMobile() {
        document.getElementById("mobileNav").style.display = "none";
      }

      // Menutup menu jika klik di area gelap
      window.onclick = function (event) {
        const modal = document.getElementById("mobileNav");
        if (event.target == modal) {
          modal.style.display = "none";
        }
      };

      // Animasi delay untuk setiap gambar
      window.addEventListener("load", () => {
        document.querySelectorAll(".fade-up").forEach((el, i) => {
          el.style.animationDelay = i * 0.1 + "s";
        });
      });
    </script>
  </body>
</html>
